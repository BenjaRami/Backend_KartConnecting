name: CI - Build and Test

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission to mvnw (Linux)
        if: runner.os == 'Linux'
        run: chmod +x mvnw

      - name: Build and run tests (Ubuntu)
        if: runner.os == 'Linux'
        run: ./mvnw -B test

      - name: Build and run tests (Windows)
        if: runner.os == 'Windows'
        run: .\\mvnw.cmd -B test
